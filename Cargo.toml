[package]
name = "sciex-io"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "SCIEX .wiff acquisition-scheme reader on top of timsim-types."
repository = "https://github.com/theGreatHerrLebert/sciex-io"

[dependencies]
# ONLY the zero-dep acquisition-scheme leaf: sciex-io builds an AcquisitionScheme through its public API
# and never touches ms-io/Arrow/Parquet — the smallest possible R9 seam.
timsim-types = "0.1.0"
# Was a git dep pinned to c07d530 while sciexwiff was a private repo; published to crates.io
# 2026-08-28, which is what allows this crate to be publishable at all (crates.io rejects any crate
# with a git dependency). That published revision carries the MIT LICENSE and the NOTICE — copyright,
# no SCIEX SDK or Clearcore2 assemblies, no redistributed vendor data, and the trademark disclaimer.
sciexwiff = "0.1.0"
